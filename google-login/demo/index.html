<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Google 로그인 데모</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #111; }
  h1 { font-size: 20px; }
  p.hint { color: #666; font-size: 14px; line-height: 1.6; }
  code { background: #f3f2ef; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  #status { margin: 20px 0; font-size: 14px; }
  #signinBtn { margin-top: 16px; }
  pre { background: #f3f2ef; padding: 14px; border-radius: 8px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .profile { display: flex; align-items: center; gap: 12px; margin: 16px 0; }
  .profile img { width: 48px; height: 48px; border-radius: 50%; }
  .err { color: #c0392b; font-size: 13px; }
</style>
</head>
<body>
  <h1>Google 로그인 데모</h1>
  <p class="hint">
    <code>server-example.js</code>가 <code>GOOGLE_CLIENT_ID</code> 환경변수를 <code>/config.json</code>으로
    내려주고, 로그인 후 받은 ID 토큰은 <code>/auth/google</code>로 보내서 서버가
    <code>verify.js</code>로 직접 서명까지 검증한 뒤 돌려준다 — 아래 결과는 서버가 검증을 마친 진짜 값이다.
  </p>

  <div id="signinBtn"></div>
  <div id="status"></div>

  <script>
    async function main() {
      const statusEl = document.getElementById('status');
      let config;
      try {
        config = await fetch('/config.json').then((r) => r.json());
        await waitForGoogleIdentity();
      } catch (e) {
        statusEl.innerHTML = '';
        const err = document.createElement('p');
        err.className = 'err';
        err.textContent = e.message || '초기화에 실패했습니다. 이 파일을 server-example.js로 서빙하고 있는지 확인하세요 (file://로 직접 열면 안 됨).';
        statusEl.appendChild(err);
        return;
      }
      google.accounts.id.initialize({ client_id: config.googleClientId, callback: handleCredentialResponse });
      google.accounts.id.renderButton(document.getElementById('signinBtn'), { type: 'standard' });
    }

    function waitForGoogleIdentity(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const check = () => {
          if (window.google?.accounts?.id) return resolve();
          if (Date.now() - start > timeoutMs) return reject(new Error('Google 로그인 스크립트를 불러오지 못했습니다'));
          setTimeout(check, 100);
        };
        check();
      });
    }

    async function handleCredentialResponse(response) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '서버에서 검증하는 중…';
      try {
        const res = await fetch('/auth/google', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ idToken: response.credential }),
        });
        const user = await res.json();
        if (!res.ok) throw new Error(user.message || user.error);

        statusEl.innerHTML = '';
        const profile = document.createElement('div');
        profile.className = 'profile';
        const img = document.createElement('img');
        img.src = user.picture;
        img.alt = '';
        const info = document.createElement('div');
        const strong = document.createElement('strong');
        strong.textContent = user.name;
        const email = document.createElement('div');
        email.textContent = user.email + (user.emailVerified ? ' (인증됨)' : '');
        email.style.cssText = 'color:#666;font-size:13px;';
        info.append(strong, document.createElement('br'), email);
        profile.append(img, info);

        const pre = document.createElement('pre');
        pre.textContent = '서버가 검증 후 돌려준 값:\n' + JSON.stringify(user, null, 2);
        statusEl.append(profile, pre);
      } catch (e) {
        statusEl.innerHTML = '';
        const err = document.createElement('p');
        err.className = 'err';
        err.textContent = '검증 실패: ' + e.message;
        statusEl.appendChild(err);
      }
    }

    main();
  </script>
</body>
</html>
