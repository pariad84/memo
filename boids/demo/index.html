<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Boids</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="../flock.js"></script>
<style>
  :root {
    --bg: #0b0f14; --panel: #121822; --ink: #e7ecf3; --sub: #93a1b3;
    --line: rgba(255,255,255,0.08); --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 40px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.hint { color: var(--sub); font-size: 13px; line-height: 1.6; margin: 0 0 16px; max-width: 640px; }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #060a0f; }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
  .hud { position: absolute; top: 10px; left: 12px; font-size: 11.5px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 18px; margin-top: 18px; }
  .ctl { display: flex; flex-direction: column; gap: 4px; }
  .ctl label { font-size: 11.5px; color: var(--sub); display: flex; justify-content: space-between; }
  .ctl label b { color: var(--ink); font-weight: 600; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .buttons { display: flex; gap: 8px; margin-top: 16px; }
  button {
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    padding: 8px 14px; cursor: pointer;
  }
  button:hover { background: #1a2230; }
  button.primary { background: var(--accent); color: #06101c; border-color: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Boids</h1>
  <p class="hint">
    각 점은 "가까운 애들과 방향 맞추기(alignment) · 너무 붙지 않기(separation) · 무리 중심 쪽으로(cohesion)"
    세 규칙만 따른다. 무리 개념은 코드 어디에도 없다 — 캔버스 위에 마우스를 올리면 포식자처럼 흩어진다.
  </p>

  <div class="stage">
    <canvas id="c" width="900" height="560"></canvas>
    <div class="hud" id="hud"></div>
  </div>

  <div class="controls">
    <div class="ctl"><label>개체 수 <b id="vCount"></b></label><input type="range" id="count" min="20" max="400" step="10" value="180" /></div>
    <div class="ctl"><label>최대 속도 <b id="vSpeed"></b></label><input type="range" id="speed" min="1" max="7" step="0.1" value="3.2" /></div>
    <div class="ctl"><label>인지 반경 <b id="vPerc"></b></label><input type="range" id="perc" min="15" max="120" step="1" value="55" /></div>
    <div class="ctl"><label>분리(separation) <b id="vSep"></b></label><input type="range" id="sep" min="0" max="3" step="0.05" value="1.6" /></div>
    <div class="ctl"><label>정렬(alignment) <b id="vAli"></b></label><input type="range" id="ali" min="0" max="3" step="0.05" value="1.0" /></div>
    <div class="ctl"><label>응집(cohesion) <b id="vCoh"></b></label><input type="range" id="coh" min="0" max="3" step="0.05" value="1.0" /></div>
  </div>

  <div class="buttons">
    <button class="primary" id="pauseBtn">일시정지</button>
    <button id="resetBtn">다시 뿌리기</button>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');

  const controls = {
    count: document.getElementById('count'),
    speed: document.getElementById('speed'),
    perc: document.getElementById('perc'),
    sep: document.getElementById('sep'),
    ali: document.getElementById('ali'),
    coh: document.getElementById('coh'),
  };
  const labels = {
    count: document.getElementById('vCount'), speed: document.getElementById('vSpeed'), perc: document.getElementById('vPerc'),
    sep: document.getElementById('vSep'), ali: document.getElementById('vAli'), coh: document.getElementById('vCoh'),
  };

  let flock = new Boids.Flock(Number(controls.count.value), {
    width: canvas.width, height: canvas.height,
    maxSpeed: Number(controls.speed.value), maxForce: 0.09,
    perceptionRadius: Number(controls.perc.value), separationRadius: 22,
    separationWeight: Number(controls.sep.value), alignmentWeight: Number(controls.ali.value), cohesionWeight: Number(controls.coh.value),
  });

  const syncLabels = () => {
    labels.count.textContent = controls.count.value;
    labels.speed.textContent = controls.speed.value;
    labels.perc.textContent = controls.perc.value;
    labels.sep.textContent = controls.sep.value;
    labels.ali.textContent = controls.ali.value;
    labels.coh.textContent = controls.coh.value;
  };
  syncLabels();

  const applyOpts = () => {
    Object.assign(flock.opts, {
      maxSpeed: Number(controls.speed.value),
      perceptionRadius: Number(controls.perc.value),
      separationWeight: Number(controls.sep.value),
      alignmentWeight: Number(controls.ali.value),
      cohesionWeight: Number(controls.coh.value),
    });
    syncLabels();
  };
  for (const key of ['speed', 'perc', 'sep', 'ali', 'coh']) controls[key].addEventListener('input', applyOpts);

  const reseed = () => {
    flock = new Boids.Flock(Number(controls.count.value), {
      width: canvas.width, height: canvas.height,
      maxSpeed: Number(controls.speed.value), maxForce: 0.09,
      perceptionRadius: Number(controls.perc.value), separationRadius: 22,
      separationWeight: Number(controls.sep.value), alignmentWeight: Number(controls.ali.value), cohesionWeight: Number(controls.coh.value),
    });
  };
  controls.count.addEventListener('change', reseed);
  document.getElementById('resetBtn').addEventListener('click', reseed);

  let paused = false;
  const pauseBtn = document.getElementById('pauseBtn');
  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '재생' : '일시정지';
  });

  let mouse = null;
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse = {
      x: (e.clientX - rect.left) / rect.width * canvas.width,
      y: (e.clientY - rect.top) / rect.height * canvas.height,
      radius: 90, strength: 4,
    };
  });
  canvas.addEventListener('pointerleave', () => { mouse = null; });

  let frames = 0, lastFpsTime = performance.now(), fps = 0;

  const draw = () => {
    ctx.fillStyle = '#060a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (mouse) {
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,90,90,0.35)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    ctx.fillStyle = '#5aa9ff';
    for (const b of flock.boids) {
      const angle = Math.atan2(b.vy, b.vx);
      const len = 6.5, wid = 3;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(len, 0);
      ctx.lineTo(-len * 0.6, wid);
      ctx.lineTo(-len * 0.6, -wid);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  };

  const loop = () => {
    if (!paused) {
      flock.step(mouse);
      draw();
    }
    frames++;
    const now = performance.now();
    if (now - lastFpsTime > 500) {
      fps = Math.round((frames * 1000) / (now - lastFpsTime));
      frames = 0; lastFpsTime = now;
      hud.textContent = `${flock.boids.length}마리 · ${fps}fps`;
    }
    requestAnimationFrame(loop);
  };
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
