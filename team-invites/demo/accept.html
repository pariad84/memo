<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>초대 수락 (데모)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; color: #111; text-align: center; }
  h1 { font-size: 20px; }
  p { color: #555; font-size: 14px; line-height: 1.6; }
  .card { border: 1px solid #eee; border-radius: 10px; padding: 24px; margin-top: 20px; }
  .status-msg { font-size: 15px; font-weight: 600; }
  .status-msg.error { color: #c0392b; }
  .status-msg.success { color: #1a7a1a; }
</style>
</head>
<body>
  <h1>초대 수락</h1>
  <div class="card" id="card">불러오는 중…</div>

  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    const card = document.getElementById('card');

    function renderMessage(text, cls) {
      card.innerHTML = '';
      const p = document.createElement('div');
      p.className = 'status-msg' + (cls ? ' ' + cls : '');
      p.textContent = text;
      card.appendChild(p);
    }

    async function loadInvite() {
      if (!token) return renderMessage('초대 토큰이 없습니다. 받은 링크 전체를 열어주세요.', 'error');
      const res = await fetch(`/invites/${token}`);
      if (!res.ok) return renderMessage('초대를 찾을 수 없습니다.', 'error');
      const invite = await res.json();

      if (invite.status === 'accepted') return renderMessage('이미 수락된 초대입니다.', 'success');
      if (invite.status === 'expired') return renderMessage('만료된 초대입니다. 초대한 사람에게 새 링크를 요청하세요.', 'error');
      if (invite.status === 'revoked') return renderMessage('취소된 초대입니다.', 'error');

      card.innerHTML = '';
      const p = document.createElement('p');
      p.innerHTML = '';
      const strong = document.createElement('strong');
      strong.textContent = invite.groupName;
      p.append(strong, '에 초대되었습니다. Google 계정으로 로그인하면 참여됩니다.');
      const onload = document.createElement('div');
      onload.id = 'g_id_onload';
      onload.dataset.client_id = 'YOUR_GOOGLE_CLIENT_ID';
      onload.dataset.callback = 'handleCredentialResponse';
      const btn = document.createElement('div');
      btn.className = 'g_id_signin';
      btn.dataset.type = 'standard';
      card.append(p, onload, btn);
      try {
        await waitForGoogleIdentity();
        google.accounts.id.initialize({ client_id: 'YOUR_GOOGLE_CLIENT_ID', callback: handleCredentialResponse });
        google.accounts.id.renderButton(btn, { type: 'standard' });
      } catch (e) {
        renderMessage(e.message, 'error');
      }
    }

    function waitForGoogleIdentity(timeoutMs = 8000) {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const check = () => {
          if (window.google?.accounts?.id) return resolve();
          if (Date.now() - start > timeoutMs) return reject(new Error('Google 로그인 스크립트를 불러오지 못했습니다'));
          setTimeout(check, 100);
        };
        check();
      });
    }

    async function handleCredentialResponse(response) {
      renderMessage('참여 처리 중…');
      try {
        const res = await fetch(`/invites/${token}/accept`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ idToken: response.credential }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error);
        renderMessage(`"${data.name}" 그룹의 멤버가 되었습니다.`, 'success');
      } catch (e) {
        renderMessage('참여 실패: ' + e.message, 'error');
      }
    }

    loadInvite();
  </script>
</body>
</html>
